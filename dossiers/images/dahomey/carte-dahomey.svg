<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 731 604" role="img" aria-labelledby="t d" font-family="'Nunito Variable', Nunito, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Carte du royaume du Dahomey et de ses voisins</title>
<desc id="d">Carte du sud de l’actuel Bénin et des régions voisines : Abomey, la capitale, avec Cana, Allada et Ouidah sur la route de la côte, Porto-Novo et Cotonou à l’est, Tado et Atakpamé à l’ouest, le pays mahi au nord, Abeokuta et Oyo au nord-est, entre les fleuves Mono et Ouémé.</desc>
<style>
 /* Couleurs du site (web/src/styles/global.css) : --bg, --bg-elevated, --fg, --fg-muted, --border, --accent. */
 .sea{fill:#ffffff}.land{fill:#f5f5f5;stroke:#cfcfcf;stroke-width:1.2}.river{fill:none;stroke:#b9c3f2;stroke-width:2}
 .dot{fill:#0a0a0a}.cap{fill:#4a5dd4}.ring{fill:none;stroke:#4a5dd4;stroke-width:2}
 .lbl{fill:#0a0a0a;font-size:15px;font-weight:700}.lbl2{fill:#0a0a0a;font-size:13.5px;font-weight:600}
 .sub{fill:#737373;font-size:12px;font-style:italic}.region{fill:#737373;font-size:12.5px;font-weight:700;letter-spacing:.14em}
 .sealbl{fill:#737373;font-size:14px;font-style:italic;letter-spacing:.2em}.rv{fill:#7d8fd9;font-size:12px;font-style:italic}
 .halo{paint-order:stroke;stroke:#f5f5f5;stroke-width:4px;stroke-linejoin:round}.halos{paint-order:stroke;stroke:#ffffff;stroke-width:4px}
 .scale{stroke:#737373;stroke-width:2}
 @media (prefers-color-scheme: dark){
  .sea{fill:#0a0a0a}.land{fill:#171717;stroke:#333333}.river{stroke:#3a4b8f}.dot{fill:#fafafa}.cap{fill:#758eff}.ring{stroke:#758eff}
  .lbl,.lbl2{fill:#fafafa}.sub,.region,.sealbl{fill:#a1a1a1}.rv{fill:#7f93e6}.halo{stroke:#171717}.halos{stroke:#0a0a0a}.scale{stroke:#a1a1a1}
 }
</style>
