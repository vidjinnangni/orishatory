<line class="lead" x1="476.6" y1="119" x2="476.6" y2="111"/>
<text class="name" x="476.6" y="97" text-anchor="middle">Agonglo</text><text class="yrs" x="476.6" y="109" text-anchor="middle">1789-1797</text>
<rect class="bar alt" x="486.2" y="119" width="46.5" height="12" rx="2"/>
<line class="lead" x1="509.4" y1="119" x2="509.4" y2="51"/>
<text class="name" x="509.4" y="37" text-anchor="middle">Adandozan</text><text class="yrs" x="509.4" y="49" text-anchor="middle">1797-1818</text>
<rect class="bar" x="533.7" y="119" width="89.5" height="12" rx="2"/>
<line class="lead" x1="578.4" y1="119" x2="578.4" y2="111"/>
<text class="name" x="578.4" y="97" text-anchor="middle">Ghézo</text><text class="yrs" x="578.4" y="109" text-anchor="middle">1818-1858</text>
<rect class="bar alt" x="624.2" y="119" width="69.1" height="12" rx="2"/>
<line class="lead" x1="658.7" y1="119" x2="658.7" y2="81"/>
<text class="name" x="658.7" y="67" text-anchor="middle">Glèlè</text><text class="yrs" x="658.7" y="79" text-anchor="middle">1858-1889</text>
<rect class="bar" x="694.3" y="119" width="10.3" height="12" rx="2"/>
<line class="lead" x1="699.5" y1="119" x2="699.5" y2="111"/>
<text class="name" x="699.5" y="97" text-anchor="middle">Béhanzin</text><text class="yrs" x="699.5" y="109" text-anchor="middle">1889-1894</text>
<rect class="bar alt" x="705.6" y="119" width="12.6" height="12" rx="2"/>
<line class="lead" x1="711.9" y1="119" x2="711.9" y2="51"/>
<text class="name" x="723.9" y="37" text-anchor="end">Agoli-Agbo</text><text class="yrs" x="723.9" y="49" text-anchor="end">1894-1900</text>
<circle class="edot" cx="322.8" cy="135" r="3"/><line class="lead" x1="322.8" y1="157" x2="322.8" y2="209"/>
<text class="ey" x="327.8" y="219" text-anchor="start">1724-1727</text><text class="et" x="327.8" y="232" text-anchor="start">prise d’Allada, puis de Ouidah</text>
<circle class="edot" cx="361.2" cy="135" r="3"/><line class="lead" x1="361.2" y1="157" x2="361.2" y2="173"/>
<text class="ey" x="366.2" y="183" text-anchor="start">1738 ou 1747</text><text class="et" x="366.2" y="196" text-anchor="start">début du tribut à Oyo</text>
<circle class="edot" cx="553.5" cy="135" r="3"/><line class="lead" x1="553.5" y1="157" x2="553.5" y2="173"/>
<text class="ey" x="558.5" y="183" text-anchor="start">v. 1827</text><text class="et" x="558.5" y="196" text-anchor="start">fin du tribut</text>
<circle class="edot" cx="702.9" cy="135" r="3"/><line class="lead" x1="702.9" y1="157" x2="702.9" y2="209"/>
<text class="ey" x="697.9" y="219" text-anchor="end">1892-1894</text><text class="et" x="697.9" y="232" text-anchor="end">prise d’Abomey, reddition de Béhanzin</text>
<text class="note" x="40" y="262">Barres en pointillés : dates traditionnelles incertaines. La régence de Hangbè (1716-1718), discutée, n’est pas représentée.</text>
</svg>
