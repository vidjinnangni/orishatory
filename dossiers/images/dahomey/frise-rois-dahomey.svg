<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" role="img" aria-labelledby="t d" font-family="'Nunito Variable', Nunito, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Frise des rois d’Abomey</title>
<desc id="d">Frise chronologique des règnes des rois du Dahomey, de Dako (vers 1620-1645, dates incertaines) à Agoli-Agbo (1894-1900), avec les principaux événements : prise d’Allada en 1724 et de Ouidah en 1727, tribut à Oyo à partir de 1738 ou 1747 jusque vers 1827, échec devant Abeokuta en 1851, prise d’Abomey en 1892 et reddition de Béhanzin en 1894.</desc>
<style>
 /* Couleurs du site (web/src/styles/global.css). */
 .bg{fill:#ffffff}.bar{fill:#4a5dd4}.bar.unc{fill:#ffffff;stroke:#4a5dd4;stroke-width:1.5;stroke-dasharray:4 3}
 .alt{fill:#3a4bb0}.name{fill:#0a0a0a;font-size:12.5px;font-weight:700}.yrs{fill:#737373;font-size:10.5px}
 .axis{stroke:#e5e5e5;stroke-width:2}.tick{fill:#737373;font-size:11px}.lead{stroke:#cfcfcf;stroke-width:1}
 .edot{fill:#0a0a0a}.ey{fill:#4a5dd4;font-size:11px;font-weight:700}.et{fill:#0a0a0a;font-size:11.5px}.note{fill:#737373;font-size:11px;font-style:italic}
 @media (prefers-color-scheme: dark){
  .bg{fill:#0a0a0a}.bar{fill:#758eff}.alt{fill:#5f75e0}.bar.unc{fill:#0a0a0a;stroke:#758eff}.name,.et{fill:#fafafa}.yrs,.tick,.note{fill:#a1a1a1}
  .axis{stroke:#333333}.lead{stroke:#444444}.edot{fill:#fafafa}.ey{fill:#758eff}
 }
</style>
