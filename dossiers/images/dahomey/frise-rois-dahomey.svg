<line class="axis" x1="40" y1="135" x2="730" y2="135"/>
<line class="axis" x1="40.0" y1="135" x2="40.0" y2="140"/><text class="tick" x="40.0" y="153" text-anchor="middle">1600</text>
<line class="axis" x1="153.1" y1="135" x2="153.1" y2="140"/><text class="tick" x="153.1" y="153" text-anchor="middle">1650</text>
<line class="axis" x1="266.2" y1="135" x2="266.2" y2="140"/><text class="tick" x="266.2" y="153" text-anchor="middle">1700</text>
<line class="axis" x1="379.3" y1="135" x2="379.3" y2="140"/><text class="tick" x="379.3" y="153" text-anchor="middle">1750</text>
<line class="axis" x1="492.5" y1="135" x2="492.5" y2="140"/><text class="tick" x="492.5" y="153" text-anchor="middle">1800</text>
<line class="axis" x1="605.6" y1="135" x2="605.6" y2="140"/><text class="tick" x="605.6" y="153" text-anchor="middle">1850</text>
<line class="axis" x1="718.7" y1="135" x2="718.7" y2="140"/><text class="tick" x="718.7" y="153" text-anchor="middle">1900</text>
<rect class="bar unc" x="97.1" y="119" width="44.2" height="12" rx="2"/>
<line class="lead" x1="119.2" y1="119" x2="119.2" y2="111"/>
<text class="name" x="119.2" y="97" text-anchor="middle">Dako</text><text class="yrs" x="119.2" y="109" text-anchor="middle">v. 1625-1645</text>
<rect class="bar unc" x="142.3" y="119" width="89.5" height="12" rx="2"/>
<line class="lead" x1="187.0" y1="119" x2="187.0" y2="81"/>
<text class="name" x="187.0" y="67" text-anchor="middle">Houégbadja</text><text class="yrs" x="187.0" y="79" text-anchor="middle">v. 1645-1685</text>
<rect class="bar unc" x="232.8" y="119" width="69.1" height="12" rx="2"/>
<line class="lead" x1="267.4" y1="119" x2="267.4" y2="111"/>
<text class="name" x="267.4" y="97" text-anchor="middle">Akaba</text><text class="yrs" x="267.4" y="109" text-anchor="middle">v. 1685-1716</text>
<rect class="bar alt" x="302.9" y="119" width="53.3" height="12" rx="2"/>
<line class="lead" x1="329.6" y1="119" x2="329.6" y2="81"/>
<text class="name" x="329.6" y="67" text-anchor="middle">Agadja</text><text class="yrs" x="329.6" y="79" text-anchor="middle">1716-1740</text>
<rect class="bar" x="357.2" y="119" width="75.9" height="12" rx="2"/>
<line class="lead" x1="395.2" y1="119" x2="395.2" y2="111"/>
<text class="name" x="395.2" y="97" text-anchor="middle">Tegbessou</text><text class="yrs" x="395.2" y="109" text-anchor="middle">1740-1774</text>
