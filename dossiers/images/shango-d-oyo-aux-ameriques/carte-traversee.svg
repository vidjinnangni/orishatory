  .river{fill:none;stroke:#8fb3d9;stroke-width:1.6}
  .people{fill:#6b7280;font-size:10px;letter-spacing:.16em;font-weight:700}
  .halo{paint-order:stroke;stroke:#eef2f7;stroke-width:3px;stroke-linejoin:round}
  .halo-land{paint-order:stroke;stroke:#dfe3dc;stroke-width:3px;stroke-linejoin:round}
  @media (prefers-color-scheme: dark){
    .sea,.inset-bg{fill:#1b2430}.land{fill:#323a35;stroke:#4a534c}
    .lbl,.dot{fill:#eceff1}.sub{fill:#b0b8c1}.region,.people{fill:#9aa3ad}.ocean{fill:#7f8b98}
