<title id="t">Carte : de la baie du Bénin aux Amériques</title>
<desc id="d">Carte de l’Atlantique montrant le pays yoruba et ses voisins fon et igbo en Afrique de l’Ouest, et les principaux foyers des cultes de Shango dans les Amériques : La Havane et Matanzas à Cuba, Trinidad, São Luís, Recife et Salvador au Brésil.</desc>
