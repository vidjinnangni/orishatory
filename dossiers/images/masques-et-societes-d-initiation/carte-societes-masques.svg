 .sea{fill:#ffffff}.land{fill:#f5f5f5;stroke:#cfcfcf;stroke-width:1}.frame{fill:#ffffff;stroke:#cfcfcf;stroke-width:1}
 .dot{fill:#4a5dd4}.lbl{fill:#0a0a0a;font-size:12.5px;font-weight:700}.pp{fill:#737373;font-size:10.5px;font-style:italic}
 .title{fill:#737373;font-size:11px;font-weight:700;letter-spacing:.12em}.halo{paint-order:stroke;stroke:#f5f5f5;stroke-width:3.5px;stroke-linejoin:round}
 .halos{paint-order:stroke;stroke:#ffffff;stroke-width:3.5px;stroke-linejoin:round}.note{fill:#737373;font-size:11px;font-style:italic}
 @media (prefers-color-scheme: dark){
  .sea,.frame{fill:#0a0a0a}.land{fill:#171717;stroke:#333333}.frame{stroke:#333333}.dot{fill:#758eff}.lbl{fill:#fafafa}.pp,.title,.note{fill:#a1a1a1}
  .halo{stroke:#171717}.halos{stroke:#0a0a0a}
 }
</style>
