<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 756 578" role="img" aria-labelledby="t d" font-family="'Nunito Variable', Nunito, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<title id="t">Carte des sociétés de masques et d’initiation citées dans le dossier</title>
<desc id="d">Carte de l’Afrique subsaharienne situant les sociétés de masques et d’initiation : Poro et Sande en Sierra Leone et au Liberia, Komo au Mali, Egungun, Gelede, Zangbeto, Mmanwu et Ékpè entre le Bénin et le Nigeria, Ngil et Mwiri au Gabon, Kipoko, Bwami et Mbudye au Congo, Mukanda en Angola et en Zambie, Nyau au Malawi, Vhusha et domba chez les Venda, Ukwaluko chez les Xhosa ; un encart situe à Cuba l’Abakuá, en Jamaïque et aux Bahamas le Junkanoo, à Trinidad le Jab Jab et le Moko Jumbie.</desc>
<style>
